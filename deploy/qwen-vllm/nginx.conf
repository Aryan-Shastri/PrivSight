events {}
http {
  limit_req_zone $binary_remote_addr zone=planner:10m rate=1r/s;
  server_tokens off;
  server {
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1800k;
    location = /health { proxy_pass http://api:8080; }
    location = /ready { proxy_pass http://api:8080; }
    location /api/ {
      limit_req zone=planner burst=10 nodelay;
      proxy_connect_timeout 5s;
      proxy_read_timeout 40s;
      proxy_send_timeout 10s;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://api:8080;
    }
    location / { return 404; }
  }
}
