services:
  vllm:
    image: vllm/vllm-openai:v0.11.0
    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --revision=0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
      - --served-model-name=Qwen/Qwen3-VL-8B-Instruct
      - --api-key=${VLLM_API_KEY:?required}
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=8192
      - --gpu-memory-utilization=0.90
      - --generation-config=vllm
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks: [private]
    expose: ["8000"]
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer ${VLLM_API_KEY}' http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: deploy/qwen-vllm/Dockerfile.api
    environment:
      PRIVSIGHT_PLANNER_MODE: QWEN_VLLM
      PRIVSIGHT_VLLM_BASE_URL: http://vllm:8000/v1
      PRIVSIGHT_VLLM_API_KEY: ${VLLM_API_KEY:?required}
      PRIVSIGHT_VLLM_MODEL: Qwen/Qwen3-VL-8B-Instruct
      PRIVSIGHT_VLLM_MODEL_REVISION: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
      PRIVSIGHT_RATE_LIMIT_PER_MINUTE: 60
    networks: [private, edge]
    expose: ["8080"]
    depends_on:
      vllm: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  nginx:
    image: nginx:1.29.1-alpine
    ports: ["443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:?required}:/etc/nginx/tls:ro
    networks: [edge]
    depends_on: [api]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
networks:
  private: {internal: true}
  edge: {}
volumes:
  hf-cache: {}
